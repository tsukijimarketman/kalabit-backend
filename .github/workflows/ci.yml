name: CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with: 
          global-json-file: global.json
      - name: Restore tools
        run: dotnet tool restore
      - name: Restore
        run: dotnet restore NotificationPlatform.sln
      - name: Build
        run: dotnet build NotificationPlatform.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test NotificationPlatform.sln --configuration Release --no-build --collect:"XPlat Code Coverage" --results-directory ./TestResults
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with: 
          name: coverage
          path: TestResults/**/coverage.cobertura.xml
          retention-days: 7
          if-no-files-found: error
