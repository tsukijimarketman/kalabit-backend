version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build"
      include: "scope"
    groups:
      ef-core:
        patterns:
          - "Microsoft.EntityFrameworkCore*"
          - "Npgsql.*"
      testing:
        patterns:
          - "xunit*"
          - "coverlet*"
          - "Microsoft.NET.Test.Sdk"
      microsoft:
        patterns:
          - "Microsoft.*"
        exclude-patterns:
          - "Microsoft.EntityFrameworkCore*"
          - "Microsoft.NET.Test.Sdk"
    #stay on .NET 10 LTS majors, see ADR-001 (docs/adr)
    ignore:
      - dependency-name: "Microsoft.AspNetCore.*"
        update-types: version-update:semver-major
      - dependency-name: "Microsoft.EntityFrameworkCore*"
        update-types: version-update:semver-major
      - dependency-name: "Microsoft.Extensions.*"
        update-types: version-update:semver-major
      - dependency-name: "Npgsql*"
        update-types: version-update:semver-major
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
      include: "scope"
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build"
      include: "scope"
