version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build"
      include: "scope"
    groups:
      ef-core:
        patterns:
          - Microsoft.EntityFrameworkCore*
          - Npgsql.*
      testing: 
        patterns:
          - xunit*
          - coverlet*
          - Microsoft.NET.Test.Sdk
      microsoft: 
        patterns:
          - Microsoft.*
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
      include: "scope"
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build"
      include: "scope"
